[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "carl"
version = "0.0.1"
description = "Causally informed anomaly detection and model-based recovery on TEP and a synthetic process benchmark."
authors = [
  { name = "Niccolò Filipas" },
  { name = "Belgin Mutlu" },
  { name = "Roman Kern" },
]

readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    
]
requires-python = "~=3.10.0"
dependencies = [
    "numpy",
    "pandas",
    "pyarrow",
    "matplotlib",
    "scikit-learn",
    "pyreadr",
]

[project.optional-dependencies]
causalai = [
    "causalai @ git+https://github.com/salesforce/causalai.git@e03c9d8e0afcdf8f3b9681f6140051327eaa3a71",
]


[tool.ruff]
line-length = 99
src = ["carl"]
include = ["pyproject.toml", "carl/**/*.py"]

[tool.ruff.lint]
extend-select = ["I"]  # Add import sorting

[tool.ruff.lint.isort]
known-first-party = ["carl"]
force-sort-within-sections = true
